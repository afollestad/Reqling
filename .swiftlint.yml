# Every violation is an error, wherever SwiftLint runs: scripts, the pre-commit hook, or an editor.
strict: true
included:
  - Sources
  - Tests
  - Package.swift
  - Tools/GraphQLFixtureServer/Sources
  - Tools/GraphQLFixtureServer/Package.swift
excluded:
  - Sources/Reqling/DI/Generated
  - Sources/ReqlingKit/GRPC/Reflection/Generated
  - Tests/ReqlingKitTests/GRPC/Generated
line_length:
  warning: 150
  error: 200
type_body_length:
  warning: 400
  error: 600
file_length:
  warning: 500
  error: 800
# A flat `switch` over flags or modes reads as one decision; count its branches, not its cases.
cyclomatic_complexity:
  ignores_case_statements: true
disabled_rules:
  - trailing_whitespace
  - opening_brace
opt_in_rules:
  - force_unwrapping
custom_rules:
  # GraphQLSwift's declarations change overload resolution in any module that can see them, and its error locations
  # are unreliable; `ReqlingGraphQLEngine` adapts it for everything else (`GraphQLEngine`).
  graphql_import:
    name: GraphQL Import
    included: /Sources/
    excluded: /Sources/ReqlingGraphQLEngine/|/Tools/
    regex: ^\s*(@testable\s+|@_implementationOnly\s+|internal\s+|public\s+)?import\s+GraphQL\s*$
    message: Only Sources/ReqlingGraphQLEngine/ imports GraphQL; use ReqlingKit's GraphQL types elsewhere.
    severity: error
  # Yams extends Foundation and standard library types, which changes how any module that sees it type-checks;
  # `ReqlingYAML` wraps it behind its own types.
  yams_import:
    name: Yams Import
    included: /Sources/
    excluded: /Sources/ReqlingYAML/
    regex: ^\s*(@testable\s+|@_implementationOnly\s+|internal\s+|public\s+)?import\s+Yams\s*$
    message: Only Sources/ReqlingYAML/ imports Yams; use ReqlingYAML's types elsewhere.
    severity: error
